[project]
name = "coastsnap-import"
version = "0.1.0"
description = "Single-site CoastSnap ingestion proof of concept: Spotteron -> Level 0/Level 1 -> Gadi (SFTP)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "requests>=2.31,<3",
    "paramiko>=3.4,<4",
    # Provides the IANA tz database for the stdlib zoneinfo module used
    # by SPOTTERON_SOURCE_TIMEZONE handling. Ubuntu/Nectar normally has
    # a system tz database already, but this Windows dev environment
    # (and some minimal container images) do not — installing it
    # unconditionally makes zoneinfo.ZoneInfo("UTC") work everywhere.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Pillow is needed ONLY by the separate thumbnail/preview command
# (python -m coastsnap_import.derivatives), which must decode Level 1
# images to downscale them. The importer itself (--plan-only,
# --process-local, --transfer) never decodes an image — Level 0/1 are
# byte copies with metadata embedded by ExifTool — so Pillow is kept
# out of the core dependencies.
derivatives = [
    "pillow>=10.3,<13",
]
dev = [
    "pytest>=8,<9",
    "responses>=0.25,<1",
    "pillow>=10.3,<13",
]

[project.scripts]
coastsnap-import = "coastsnap_import.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coastsnap_import*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
